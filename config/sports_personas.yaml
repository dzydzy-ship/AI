# 运动人群画像与话术（同一款商品，新手和进阶要两套说法）
#
# 为什么需要：新手怕被劝退（"3U 4U、磅数、碳板"这些词会直接把他赶走），
# 进阶怕被糊弄（只讲"舒服好看"没有信息量）。同一段文案只能命中一个人群，
# 所以生成时按商品档案里的 level 字段切模板。

version: 1

levels:
  beginner:
    name: 新手
    pain_points: [不知道怎么选, 怕买贵, 怕用不好, 怕受伤]
    tone: "口语、少术语、给结论、先说'够不够用'"
    must_avoid: [行话堆砌, 参数罗列, 对比评测]
    opening: "如果你刚开始练，别急着买贵的"
    structure:
      - "新手最常犯的一个错"
      - "够用就好：这个价位能解决什么"
      - "什么情况下不用买/可以再等等"
  advanced:
    name: 进阶
    pain_points: [参数虚标, 升级性价比, 细节差异, 训练效果]
    tone: "参数、对比、承认局限，不吹"
    must_avoid: [空泛形容词, 绝对化承诺]
    opening: "这款的取舍我看下来是这样"
    structure:
      - "关键参数与同价位横向差异"
      - "适合谁 / 不适合谁"
      - "真实短板与替代方案"

# 内容形式 ↔ 结构（新增三种运动内容形式）
forms:
  training_log:
    name: 训练打卡
    structure: ["今天练什么", "一个可复用的小技巧", "装备在第几步起作用", "不承诺结果"]
  gear_review:
    name: 装备测评
    structure: ["测试条件", "三个可验证的观察", "短板", "适合人群"]
  event_cheer:
    name: 赛事应援
    structure: ["赛前提醒", "赛日流程", "完赛恢复", "合规声明"]

# 平台语气微调（覆盖平台 skill 里的通用语气）
platform_tone:
  xiaohongshu: "第一人称+短句+一个真实小场景"
  douyin: "前 3 秒抛结论，口播像朋友提醒"
  bilibili: "先给结论再给依据，允许承认'这次测得不充分'"
  kuaishou: "直接给建议，少铺垫"
  ecommerce: "参数在前，卖点在后，别写故事"
