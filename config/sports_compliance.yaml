# 体育领域合规红线（内容生成时硬拦截）
#
# 通用电商禁用词只拦"最/第一/国家级"，拦不住体育特有的四类雷：
#   1. 疗效宣称：护具/筋膜枪说"治好膝盖疼"——医疗器械广告违规；
#   2. 成绩承诺：跑鞋说"包过 330 / 提升 30%"——虚假宣传；
#   3. 身份挪用：没有授权说"国家队同款 / 官方指定"；
#   4. 赛事版权：赛事 logo、赛道照片、运动员肖像——商用侵权。
#
# 每条规则都有 label（界面展示的"命中哪条"）与 terms/suggest（给合规改写用）。

version: 1

rules:
  - key: medical_claim
    label: 疗效宣称
    terms: [治好, 根治, 治疗, 治愈, 康复, 消炎, 止痛, 矫正, 修复关节, 缓解疼痛, 医学证明, 包治, 药到病除]
    suggest: "改成使用感受：'长时间佩戴更舒适'，不要出现治疗/康复字眼"
    disclaimers: ["护具不能替代医疗诊断与治疗"]
  - key: performance_promise
    label: 成绩承诺
    terms: [包过, 包PB, 必进, 提升30%, 快2秒, 轻松破三, 保证提升, 绝对提升, 一夜变强]
    suggest: "删掉承诺性数字，改成条件句：'在科学训练前提下可提升训练效率'"
  - key: identity_misuse
    label: 身份挪用
    terms: [国家队同款, 官方指定, 奥运同款, 运动员同款, 官方合作, 赞助商]
    suggest: "无授权的身份表述一律删除；有授权则标注授权编号"
  - key: event_copyright
    label: 赛事版权
    terms: [赛事logo, 赛道照片, 完赛奖牌照, 官方纪念品]
    suggest: "改用自拍/原创素材，赛事物料需获得授权"
  - key: absolute_safety
    label: 绝对安全
    terms: [绝对安全, 永不崴脚, 100%防起雾, 零受伤, 完全防水]
    suggest: "改成限定条件：'按说明佩戴可降低风险'"
  # 条件规则：只有商品档案里登记了认证编号才允许出现认证类表述
  - key: cert_claim
    label: 认证宣称
    terms: [认证, 防护等级, 检测报告, 质检报告, 国际标准]
    requires_cert_no: true
    suggest: "先在「运动档案」登记认证编号再写；没有编号就不要出现认证/防护等级表述"
    disclaimers: ["认证信息以证书编号可查询为准"]

# 这些品类的商品必须能追溯到认证编号，否则内容里不得出现"认证/防护等级"表述
cert_required_categories: [护具, 护膝, 护踝, 头盔, 骑行头盔, 雪镜, 能量胶, 蛋白粉]

# 所有运动内容结尾建议附上的通用声明
general_disclaimer: "运动有风险，请根据自身情况循序渐进；装备参数以实物与官方说明为准。"

# 平台规则里体育品类的额外提醒（叠加在 platforms.yaml 之上）
platform_extra:
  xiaohongshu: "器械与补剂不做功效对比，不写'亲测有效'"
  douyin: "运动镜头不得出现危险动作示范；不得使用赛事画面"
  bilibili: "测评结论注明测试条件与样本量"
  kuaishou: "口播避免绝对化承诺"
  ecommerce: "详情页参数与检测报告编号必须一致"
